global:
  # Slack webhook (configure your own)
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Route tree
route:
  receiver: 'default'
  group_by: ['alertname', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h
  
  routes:
    # Critical alerts go to slack immediately
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true
    
    # Warning alerts grouped
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 30s
      group_interval: 5m

# Receivers
receivers:
  - name: 'default'
    # Default receiver (can be email, webhook, etc.)
  
  - name: 'slack-critical'
    slack_configs:
      - channel: '#alpharl-alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
  
  - name: 'slack-warnings'
    slack_configs:
      - channel: '#alpharl-alerts'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

# Inhibition rules (suppress certain alerts if others are firing)
inhibit_rules:
  # If database is down, don't alert on database latency
  - source_match:
      alertname: 'DatabaseDown'
    target_match:
      alertname: 'HighDatabaseLatency'
    equal: ['instance']
