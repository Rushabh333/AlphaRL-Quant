name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # Create Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for changelog
      
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release - using full history"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog from $PREVIOUS_TAG to ${{ steps.version.outputs.version }}"
            CHANGELOG=$(git log ${PREVIOUS_TAG}..${{ steps.version.outputs.version }} \
              --pretty=format:"- %s (%h)" \
              --no-merges)
          fi
          
          # Save to file
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$CHANGELOG" >> CHANGELOG.md
          
          cat CHANGELOG.md
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: AlphaRL-Quant ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  # =============================================================================
  # Build and Push Tagged Images
  # =============================================================================
  build-images:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push production image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push training image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: training
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}-training
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-training
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Build Release Artifacts
  # =============================================================================
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist/
      
      - name: Create binary wheel
        run: |
          python -m build --wheel --outdir dist/
      
      - name: Package deployment scripts
        run: |
          mkdir -p release-artifacts
          
          # Package scripts
          tar -czf release-artifacts/alpharl-scripts-${{ needs.create-release.outputs.version }}.tar.gz \
            scripts/ \
            deploy.sh \
            docker-compose.yml \
            docker-compose.monitoring.yml
          
          # Package configs
          tar -czf release-artifacts/alpharl-configs-${{ needs.create-release.outputs.version }}.tar.gz \
            config/ \
            .env.example \
            .dockerignore
          
          # Package documentation
          tar -czf release-artifacts/alpharl-docs-${{ needs.create-release.outputs.version }}.tar.gz \
            docs/ \
            README.md \
            DEPLOYMENT.md \
            ARCHITECTURE.md
      
      - name: Upload artifacts to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/alpharl-scripts-${{ needs.create-release.outputs.version }}.tar.gz
          asset_name: alpharl-scripts-${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Upload Python packages
        uses: pypa/gh-action-pypi-publish@release/v1
        if: false  # Disabled by default, enable when ready to publish
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # =============================================================================
  # Deploy to Production
  # =============================================================================
  deploy-production:
    name: Deploy Release to Production
    runs-on: ubuntu-latest
    needs: [create-release, build-images]
    environment:
      name: production
      url: https://alpharl-quant.example.com
    
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying ${{ needs.create-release.outputs.version }} to production..."
          # Add actual deployment commands here
          # aws ecs update-service --cluster prod --service alpharl --force-new-deployment
          echo "✅ Deployed to production"
      
      - name: Run smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          # curl -f https://alpharl-quant.example.com/health
          echo "✅ Smoke tests passed"

  # =============================================================================
  # Notify Release
  # =============================================================================
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, deploy-production]
    if: always()
    
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🎉 AlphaRL-Quant Release ${{ needs.create-release.outputs.version }}",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Version", "value": "${{ needs.create-release.outputs.version }}", "short": true},
                  {"title": "Status", "value": "${{ needs.deploy-production.result }}", "short": true},
                  {"title": "Release Notes", "value": "https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}", "short": false}
                ]
              }]
            }' || echo "Slack notification failed"
      
      - name: Create release summary
        run: |
          echo "# 🎉 Release ${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Successfully released and deployed to production**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Page:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- Production: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Training: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}-training\`" >> $GITHUB_STEP_SUMMARY
