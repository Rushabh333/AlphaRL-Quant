name: Continuous Integration

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  CACHE_VERSION: v1

jobs:
  # =============================================================================
  # Code Quality Checks
  # =============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          pip install black flake8 mypy isort
      
      - name: Check formatting with Black
        run: |
          black --check src/ tests/
      
      - name: Check import sorting
        run: |
          isort --check-only src/ tests/
      
      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Type checking with mypy
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true

  # =============================================================================
  # Unit Tests
  # =============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/test_data/ tests/test_features/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            -n auto \
            -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: alpharl_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      
      - name: Initialize test database
        env:
          POSTGRES_PASSWORD: test_password
        run: |
          PGPASSWORD=test_password psql -h localhost -U trader -d alpharl_quant_test -f scripts/init_db.sql
      
      - name: Run integration tests
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: alpharl_quant_test
          DB_HOST: localhost
          DB_PORT: 5432
          ENVIRONMENT: test
        run: |
          pytest tests/integration/ -v

  # =============================================================================
  # Model Validation (NEW - User Requested)
  # =============================================================================
  model-validation:
    name: Model Training Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Quick training smoke test
        run: |
          # Train for 100 steps to ensure pipeline works
          python src/training/train_agent.py --timesteps 100 --no-tensorboard
        timeout-minutes: 10
      
      - name: Validate model can be loaded
        run: |
          python -c "
          from stable_baselines3 import PPO
          import os
          
          model_path = 'models/ppo_trading_final.zip'
          if os.path.exists(model_path):
              model = PPO.load(model_path)
              print('✅ Model loads successfully')
          else:
              print('⚠️ No model found (expected for quick test)')
          "
      
      - name: Upload model artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-model
          path: models/
          retention-days: 7

  # =============================================================================
  # Docker Build Validation
  # =============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build production image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: production
          push: false
          tags: alpharl-quant:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build training image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: training
          push: false
          tags: alpharl-quant-training:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test image can run
        run: |
          docker run --rm alpharl-quant:test python --version

  # =============================================================================
  # Performance Benchmarks (NEW - User Requested)
  # =============================================================================
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-benchmark
      
      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ \
            --benchmark-only \
            --benchmark-min-rounds=10 \
            --benchmark-json=benchmark.json
        continue-on-error: true
      
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name == 'push'
        with:
          tool: 'pytest'
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

  # =============================================================================
  # Summary
  # =============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, integration, model-validation, docker-build]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          echo "## 🔍 CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Model Validation | ${{ needs.model-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail if any critical job failed
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.integration.result }}" == "failure" ]]; then
            echo "❌ **CI Failed!** Please fix the issues above." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          fi
