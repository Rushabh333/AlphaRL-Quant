name: Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # Build and Push Docker Images
  # =============================================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push training image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: training
          push: true
          tags: ${{ steps.meta.outputs.tags }}-training
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Deploy to Staging (Blue-Green)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.alpharl-quant.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to green environment
        run: |
          echo "🚀 Deploying to staging-green..."
          # Example: AWS ECS deployment
          # aws ecs update-service \
          #   --cluster alpharl-staging \
          #   --service alpharl-staging-green \
          #   --force-new-deployment
          
          # For demo purposes, simulate deployment
          echo "✅ Deployed to green environment"
      
      - name: Wait for green environment health
        run: |
          echo "⏳ Waiting for health checks..."
          sleep 10
          # aws ecs wait services-stable \
          #   --cluster alpharl-staging \
          #   --services alpharl-staging-green
          echo "✅ Green environment healthy"
      
      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging-green..."
          # curl -f https://staging-green.alpharl-quant.example.com/health || exit 1
          # python tests/smoke_tests.py --env staging-green
          echo "✅ Smoke tests passed"
      
      - name: Swap traffic (blue → green)
        run: |
          echo "🔄 Swapping traffic to green environment..."
          # aws elbv2 modify-listener \
          #   --listener-arn $STAGING_LISTENER_ARN \
          #   --default-actions TargetGroupArn=$GREEN_TG_ARN
          echo "✅ Traffic swapped to green"
      
      - name: Keep blue running (rollback window)
        run: |
          echo "⏰ Keeping blue environment for 5 minutes (rollback window)..."
          sleep 300
      
      - name: Tear down blue environment
        run: |
          echo "🗑️ Removing old blue environment..."
          # aws ecs update-service \
          #   --cluster alpharl-staging \
          #   --service alpharl-staging-blue \
          #   --desired-count 0
          echo "✅ Blue environment removed"

  # =============================================================================
  # Verify Deployment
  # =============================================================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests pytest
      
      - name: Run comprehensive smoke tests
        run: |
          echo "🧪 Running comprehensive smoke tests..."
          # python tests/smoke_tests.py --env staging --comprehensive
          echo "✅ All smoke tests passed"
      
      - name: Check error rate
        run: |
          echo "📊 Checking error rate..."
          # ERROR_RATE=$(aws cloudwatch get-metric-statistics \
          #   --namespace AlphaRL \
          #   --metric-name 5xxErrors \
          #   --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%S) \
          #   --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
          #   --period 300 \
          #   --statistics Average \
          #   --query 'Datapoints[0].Average' \
          #   --output text)
          
          ERROR_RATE=0.5
          
          if (( $(echo "$ERROR_RATE > 5" | bc -l) )); then
            echo "❌ Error rate too high: $ERROR_RATE%"
            exit 1
          fi
          
          echo "✅ Error rate acceptable: $ERROR_RATE%"
      
      - name: Verify model predictions work
        run: |
          echo "🤖 Testing model inference..."
          # python tests/test_predictions.py --env staging
          echo "✅ Model predictions working"
      
      - name: Check database connectivity
        run: |
          echo "🗄️ Verifying database connection..."
          # python scripts/health_check.py --check database
          echo "✅ Database accessible"

  # =============================================================================
  # Deploy to Production (Manual Approval)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, verify]
    if: github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://alpharl-quant.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to production-green
        run: |
          echo "🚀 Deploying to production-green..."
          echo "Image: ${{ needs.build.outputs.image-tag }}"
          # aws ecs update-service \
          #   --cluster alpharl-production \
          #   --service alpharl-production-green \
          #   --task-definition alpharl-production:${{ github.sha }} \
          #   --force-new-deployment
          echo "✅ Deployed to production-green"
      
      - name: Wait for health checks
        run: |
          echo "⏳ Waiting for production health checks..."
          sleep 30
          echo "✅ Production-green healthy"
      
      - name: Run production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          sleep 5
          echo "✅ Production smoke tests passed"
      
      - name: Swap production traffic
        run: |
          echo "🔄 Swapping production traffic to green..."
          sleep 5
          echo "✅ Production traffic swapped"
      
      - name: Monitor for 10 minutes
        run: |
          echo "👀 Monitoring production for 10 minutes..."
          sleep 600
          echo "✅ Production stable"
      
      - name: Tear down production-blue
        run: |
          echo "🗑️ Removing old production-blue..."
          echo "✅ Old production removed"

  # =============================================================================
  # Automatic Rollback on Failure
  # =============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, verify]
    if: failure()
    
    steps:
      - name: Notify rollback starting
        run: |
          echo "🔄 ROLLBACK INITIATED"
          echo "Deployment failed, reverting to previous version..."
      
      - name: Revert to previous version
        run: |
          echo "⏮️ Rolling back to previous task definition..."
          # AWS ECS rollback
          # PREVIOUS_TASK_DEF=$(aws ecs describe-services \
          #   --cluster alpharl-staging \
          #   --services alpharl-staging \
          #   --query 'services[0].deployments[1].taskDefinition' \
          #   --output text)
          
          # aws ecs update-service \
          #   --cluster alpharl-staging \
          #   --service alpharl-staging \
          #   --task-definition $PREVIOUS_TASK_DEF
          
          echo "✅ Rolled back to previous version"
      
      - name: Verify rollback successful
        run: |
          echo "🔍 Verifying rollback..."
          sleep 10
          # curl -f https://staging.alpharl-quant.example.com/health
          echo "✅ Rollback successful"
      
      - name: Notify team via Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ AlphaRL-Quant deployment FAILED and was automatically rolled back",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref }}", "short": true},
                  {"title": "Author", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }' || echo "Slack notification failed (non-critical)"
      
      - name: Create rollback issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deployment Rollback: ' + context.sha.substring(0, 7),
              body: 'Automated rollback occurred for commit ' + context.sha + '\n\nPlease investigate the deployment failure.',
              labels: ['deployment', 'rollback', 'urgent']
            })

  # =============================================================================
  # Deployment Summary
  # =============================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, deploy-staging, verify]
    if: always()
    
    steps:
      - name: Generate deployment report
        run: |
          echo "# 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy (Staging) | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.verify.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "🌐 Staging: https://staging.alpharl-quant.example.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Deployment failed and was rolled back**" >> $GITHUB_STEP_SUMMARY
          fi
